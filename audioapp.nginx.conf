# Audio Processing App Configuration
# Domain: audio.precisepouchtrack.com
# Backend Port: 8001
# Frontend: Static Build served by nginx

server {
    server_name audio.precisepouchtrack.com;

    # SSL Configuration
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/audio.precisepouchtrack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audio.precisepouchtrack.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers (S5)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://huggingface.co https://*.huggingface.co https://cdn-lfs.huggingface.co https://cdn-lfs-us-1.huggingface.co https://hf.co https://*.hf.co https://cdn.jsdelivr.net; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com;" always;

    # Allow Certbot validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Frontend - Serve React Build Files
    root /opt/audioapp/frontend/audio-waveform-visualizer/build;
    index index.html;

    # Frontend static assets (CSS, JS, images)
    # Note: try_files is omitted here because it conflicts with alias in nginx
    location /static/ {
        alias /opt/audioapp/frontend/audio-waveform-visualizer/build/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Backend API
    location /api/ {
        proxy_pass http://localhost:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Long timeouts for audio processing
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://localhost:8001/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend static files (Django admin assets, etc)
    location /backend-static/ {
        proxy_pass http://localhost:8001/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media Files (audio, PDFs) - Served directly by nginx
    location /media/ {
        alias /opt/audioapp/backend/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # WebSocket support
    location /ws/ {
        proxy_pass http://localhost:8001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router - Serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Max upload size for audio files
    client_max_body_size 500M;
    client_body_timeout 300s;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name audio.precisepouchtrack.com;

    if ($host = audio.precisepouchtrack.com) {
        return 301 https://$host$request_uri;
    }
    
    return 404;
}
